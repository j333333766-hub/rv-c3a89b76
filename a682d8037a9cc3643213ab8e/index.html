<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>불일치 답안 판단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2733;--sub:#5b6878;--line:#dfe4ea;--blue:#2f5597;--blue-s:#e8eef8;--cl:#7b4bb7;--cl-s:#f2ecfa;--ai:#c0571b;--ai-s:#fdf0e6;--ok:#2e7d4f;--ok-s:#e6f4ec;--warn:#9a6b00;--warn-s:#fff6dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:16px;margin:0;font-weight:700;margin-right:auto}
header select,header button,header label.btn{font:inherit;font-size:13px;border:0;border-radius:6px;padding:6px 10px;background:#fff;color:var(--blue);cursor:pointer}
header button.primary{background:#ffd54a;color:#3a2a00;font-weight:700}
.bar{height:6px;background:#dbe3ef}.bar i{display:block;height:100%;background:#2e7d4f;width:0;transition:width .2s}
main{max-width:1100px;margin:0 auto;padding:16px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:500;background:var(--blue-s);color:var(--blue)}
.chip.v{background:#eef1f4;color:var(--sub)}
.pos{margin-left:auto;color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:13px;color:var(--sub);margin:0 0 6px;font-weight:500}
.answer{font-size:18px;white-space:pre-wrap;word-break:break-word}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who{border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.who.c{background:var(--cl-s);border-color:#dccbf0}.who.a{background:var(--ai-s);border-color:#f3d2b8}
.who b.s{font-size:30px;line-height:1;margin-right:6px}.who.c b.s{color:var(--cl)}.who.a b.s{color:var(--ai)}
.who .t{font-size:13px;color:var(--sub)}
.who p{margin:6px 0 0;font-size:14px}
.note{background:var(--warn-s);border-color:#f1dea0}
.note .vd{font-weight:700;color:var(--warn)}
.dec h2{margin-bottom:8px}
.scores{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.scores button{width:52px;height:52px;border-radius:10px;border:2px solid var(--line);background:#fff;font:700 20px "Noto Sans KR";cursor:pointer;position:relative}
.scores button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.scores button .tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;padding:0 5px;border-radius:6px;white-space:nowrap}
.tag.c{background:var(--cl);color:#fff}.tag.a{background:var(--ai);color:#fff}.tag.ca{background:#555;color:#fff}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.opts button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.opts button.on{background:var(--blue);border-color:var(--blue);color:#fff}
label.ck{display:inline-flex;gap:6px;align-items:center;font-size:14px;margin-bottom:8px;cursor:pointer}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;resize:vertical}
nav.foot{display:flex;gap:10px;justify-content:space-between;margin:14px 0 30px}
nav.foot button{flex:1;max-width:240px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer}
nav.foot button.next{background:var(--blue);color:#fff;border-color:var(--blue)}
details.rub{margin-bottom:12px}
details.rub summary{cursor:pointer;color:var(--blue);font-weight:500}
details.rub pre{white-space:pre-wrap;font:13px/1.6 "Noto Sans KR";background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:420px;overflow:auto}
.help{font-size:12px;color:var(--sub);text-align:center}
.done-mark{color:var(--ok);font-weight:700}
#list{display:none}
#list.show{display:block}
#list table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
#list td,#list th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
#list tr{cursor:pointer}#list tr:hover{background:var(--blue-s)}
@media (max-width:720px){.two{grid-template-columns:1fr}.answer{font-size:16px}header h1{width:100%}}
</style>
</head>
<body>
<header>
  <h1>불일치 답안 판단 · 2026 종단연구 중등 수리 시범채점</h1>
  <select id="fItem" aria-label="문항"><option value="">전체 문항</option><option>A3</option><option>C4-2</option><option>D5</option></select>
  <select id="fState" aria-label="상태"><option value="">전체</option><option value="todo">판단 안 한 것</option><option value="done">판단한 것</option><option value="rub">기준 수정 필요</option></select>
  <button id="bList" type="button">목록</button>
  <label class="btn" title="저장해 둔 CSV를 불러와 이어서 판단">CSV 불러오기<input id="fileIn" type="file" accept=".csv" hidden></label>
  <button id="bCsv" class="primary" type="button">CSV 저장</button>
</header>
<div class="bar"><i id="prog"></i></div>
<main>
  <div id="list" class="card"></div>
  <div id="view"></div>
  <p class="help">← → 이전·다음 · 숫자키 최종 점수 · A: AI가 맞음 · C: Claude가 맞음 · N: 둘 다 아님 · 판단은 이 브라우저에 자동 저장되고, CSV 저장으로 파일을 받습니다.</p>
</main>

 대응, 악보 그림 있음).\n\"이 종소리의 은은한 울림이 길게 이어져 소수점 50번째 숫자에 도달했을 때, 그 숫자가 무엇인지 구하고 그 과정을 서술하시오.\" (200자 이내)\n정답: 3/7 = 0.428571428571… 순환마디 428571(길이 6), 50 = 6×8 + 2 → 순환마디 2번째 숫자 → 2.\n(학생이 악보의 음 이름(도·레·미…)으로 답할 수도 있음: 숫자 2에 대응하는 음은 '레'일 가능성이 큼 — 음 이름만 쓴 답안은 flag)\n\n0점\n- 미작성 또는 오답 / 문제와 전혀 관련 없는 식이나 글 / 분수를 소수로 바르게 표현하지 못한 경우\n- 예: 백지, 무의미 문자열 / 7÷3=2.333…으로 계산하여 3이라 한 경우 / 0.444…로 잘못 표현한 경우\n1점\n- 순환마디 428571을 바르게 제시하였으나 50번째 수를 찾는 과정을 논리적으로 설명하지 못한 경우\n- 순환마디는 찾지 못했으나 50번째 수가 2라고만 제시한 경우(2라는 사실에 대한 논리적 설명이 부족한 경우 포함)\n- 50번째 수를 찾는 과정(순환마디의 길이가 6이고, 8번 반복되고, 2번째 수임)을 설명한 경우\n- 예: \"3/7=0.4̇28571̇이므로 순환마디는 428571이다.\" / \"순환마디는 428571\"만 쓴 경우 / 설명 없이 \"2\"만 쓴 경우 / \"일일이 세어 보니 2다\"처럼 규칙성 설명 없이 답만 맞은 경우\n2점\n- 순환마디 428571을 바르게 제시하였고 50÷6을 계산하였으나 정답 2를 찾지 못한 경우\n- 순환마디 428571을 바르게 제시하였고 50번째 수가 2임을 찾았으나, 그에 대한 논리적 설명이 없거나 틀린 경우\n- 순환마디를 제시하지 못하거나 일부가 틀렸지만, 50÷6을 계산하여 반복 규칙성을 통해 50번째 수가 2임을 찾은 경우\n- 예: \"…순환마디는 428571이다. 소수점 아래 50번째 자리를 구하기 위해 50÷6을 이용한다.\" / \"…50÷6=8…2임을 제시하였으나 계산과정에 실수가 있고 50번째 자리 2는 맞은 경우\" / \"순환마디 428571, 50÷6=8…2\" 후 자리 해석 오류로 4·8 등을 답한 경우 / \"0.428571…이 반복되므로 50번째는 2이다\"(나눗셈 과정 없음) / 순환마디를 328571 등으로 잘못 옮겼으나 50÷6=8…2로 두 번째 자리 2를 찾은 경우\n3점\n- 분수를 순환소수로 올바르게 나타내어 순환마디 428571을 찾고, 나눗셈 식과 나머지(또는 6×8=48과 같은 6의 배수 규칙)를 이용하여 소수점 아래 50번째 자리 숫자가 2임을 바르게 구한 경우\n- 예: \"3/7=0.4̇28571̇이므로 순환마디는 428571이다. 50÷6=8…2이므로, 순환마디 2번째 숫자는 2이다.\" / \"…순환마디가 8번 반복되고 두 번째 숫자를 찾으면 정답은 2이다.\" / \"6×8=48이므로 48번째는 1, 49번째는 4, 50번째는 2\"(6의 배수 규칙 활용도 동등 인정)\n(주의: 1점 셋째 줄 \"과정을 설명한 경우\"와 2점·3점 기준이 겹쳐 보이는 부분이 있음 — 판단이 갈리면 flag)", "C4-2": "## C4-2 (3점) — 밑면 없는 원뿔 고깔모자, 종이가 더 많이 필요한 쪽의 '이유'\n문항: 밑면이 없는 원뿔 모양 고깔모자. 여학생 모자 밑면 반지름 15cm·모선 25cm, 남학생 모자 밑면 반지름 20cm·모선 25cm.\n\"누구 모자를 만드는데 종이가 더 많이 필요한지 쓰고 그 이유를 아래 빈칸에 서술하시오. (단, 원주율은 π로 계산한다.)\"\n- C4-1(남학생/여학생 고르기)은 따로 자동 채점되고, 여기 C4-2는 '이유' 칸 글만 보인다. 이유 글 안에 누구인지 쓰여 있으면 그것으로 판단.\n정답: 남학생. 옆넓이 = π×모선×반지름 → 여 375π cm², 남 500π cm². 또는 호의 길이 30π/40π, 중심각 216°/288°.\n\n0점\n- 미작성 또는 오답 / 백지 / 문제와 전혀 관련 없는 식이나 글 / 원의 넓이나 둘레 공식을 잘못 적용하여 처음부터 틀린 경우 / π를 빠트리고 식을 세워 답을 구한 경우\n1점\n- \"남학생 모자 밑면의 반지름이 (모선이 같을 때) 더 크기 때문\"이라는 이유를 적은 경우 — 계산 과정이 없거나 틀린 경우 포함(반지름 이유는 계산 과정에 점수를 부여하지 않으므로 최대 1점)\n- \"옆면(부채꼴)의 호의 길이가 더 크기 때문\" / \"옆면(부채꼴)의 중심각이 더 크기 때문\" / \"옆면의 넓이(또는 겉넓이)가 더 크기 때문\"이라고 적었으나 계산 과정이 없거나 틀린 경우\n- 옆넓이·호의 길이·중심각을 구하는 식은 타당하게 세웠으나 계산 오류가 있거나 한쪽 값만 구한 경우\n- 밑면인 원의 둘레(부채꼴의 호의 길이)는 2π×15=30πcm를 이용해 옆면의 넓이를 하나라도 제대로 구한 경우\n- 이유는 없으나 남학생 모자가 옆면이 크다고 한 경우\n- 예: \"모선 길이는 같고 밑면 반지름이 5cm 더 크기 때문\" / \"호의 길이가 더 길어서\"(값 미산출) / 옆넓이를 400π 등으로 잘못 계산 / \"남학생 500π\"만 구하고 여학생 값 미산출\n2점\n- 두 모자의 종이(옆면 부채꼴) 넓이가 각각 500π, 375π임을 구해 남학생 모자가 더 크다고 비교한 경우\n- 옆면 호의 길이가 여학생 30π, 남학생 40π임을 구하고 \"남학생 모자의 호의 길이가 더 크기 때문\"이라고 이유를 밝힌 경우\n- 옆면 중심각이 여학생 216°, 남학생 288°임을 구하고 \"남학생 모자의 중심각이 더 크기 때문\"이라고 이유를 밝힌 경우\n- 예: \"부채꼴 호의 길이는 밑면인 원의 둘레와 같으므로 2π×15=30πcm이다. 종이의 넓이는 1/2×25×30π이다.\"(정답은 틀린 경우) / \"…중심각을 x°라 하면 2π×25×x/360=30π이다.\"(중심각의 크기는 틀린 경우)\n3점\n- 남학생 모자가 넓다고 찾고 그 이유로 옆면인 부채꼴의 넓이 구하는 식을 바르게 계산하여 남학생·여학생의 모자 넓이를 비교하고 그 과정을 서술한 경우\n- 모선의 길이가 같더라도 밑면 반지름이 클수록 옆면 넓이가 커진다는 사실을 이유로 서술한 경우\n- 예: 1) 호의 길이 30π → 여 1/2×25×30π=375π, 남 500π / 2) 중심각 216° → π×25²×216/360=375π, 남 500π / 3) \"모선의 길이가 같더라도 밑면 반지름이 클수록 옆면 넓이가 커진다. 그래서 남학생 모자의 옆면이 더 넓다.\"\n(주의: 1점 첫째 줄 \"반지름이 더 크기 때문\"은 최대 1점인데, 3점 둘째 줄 \"반지름이 클수록 옆면 넓이가 커진다는 사실\"은 3점 — 두 기준의 경계가 애매함. 반지름만 언급 vs 옆면 넓이와의 관계까지 서술을 구분하되, 판단이 갈리면 flag)\n참고 — 예비조사 의견서(같은 모자 문항):\n- \"남학생 모자 밑면 반지름이 더 크기 때문\"(계산 없음) → 1점 합의. '모선이 더 길다' 등 오류가 섞인 혼합 답안 처리는 미확정.\n- 밑면 포함 겉넓이 600π/900π로 비교(과정에 옆넓이 375π/500π 산출 포함) → '밑면 없는 모자' 조건 오독이나 옆넓이 산출·대소 비교는 타당 → 미합의, 옆넓이 산출 명시면 2점 권고.", "D5": "## D5 (6점) — 통학 수단 표, 제안서 (조건 3개 × 각 0~2점)\n문항: A 중학교 통학 수단 — 도보 60, 자전거 80, 버스 55, 지하철 30, 기타 25, 합계 250(명).\n<조건>\n① 전체 학생 수에 대한 통학 수단 항목별 학생 수의 비율을 알기 쉽도록 이 표를 정리하여 그래프로 나타낼 수 있는 방법을 한 가지 이상 제시하고, 그 이유를 설명할 것\n② 통학 수단 중 비율이 가장 높은 항목과 그 항목의 비율을 구할 것 (자전거, 80/250=32%)\n③ 비율이 가장 높은 항목에 대하여 통학 여건 개선을 위한 의견을 제안하고, 그 이유를 설명할 것\n\n조건 ① 그래프\n- 0점: 그래프로 나타낼 방법을 한 가지 이상 제시하지 못한 경우 / 미작성 / 수량을 나타내는 목적인 그래프(막대그래프, 꺾은선그래프, 그림그래프, 히스토그램 등)는 오답 처리\n- 1점: 방법을 제시하였지만 이유를 설명하지 못한 경우. 예: \"원그래프를 이용하여 나타낼 수 있다\", \"띠그래프를 이용하여 나타낼 수 있다\" — 원그래프(파이차트)·띠그래프만 정답 인정\n- 2점: 방법을 제시하고 이유를 설명한 경우. 예: \"원그래프로 나타내면 전체 학생 수에 대한 항목별 비율을 확인하기 쉽다.\" — 원그래프·띠그래프만 정답 인정\n조건 ② 가장 높은 항목과 비율\n- 0점: 항목과 비율 모두 구하지 못한 경우 / 미작성\n- 1점: 둘 중 한 가지만 구한 경우(예: '자전거'만, 또는 '32%'만)\n- 2점: 둘 다 구한 경우(자전거, 32%)\n조건 ③ 개선 의견\n- 0점: 의견을 작성하지 못한 경우 / 미작성\n- 1점: 의견을 작성하였지만 이유를 설명하지 못한 경우. 예: \"자전거 도로를 늘려주세요\", \"자전거 거치대를 추가 설치해주세요\" — 자전거와 관련된 내용만 정답 인정\n- 2점: 의견을 작성하고 이유를 설명한 경우. 예: \"자전거를 타고 통학하는 학생이 많으므로 학생들의 안전을 위해서 자전거 도로를 늘리고, 학교에 자전거 거치대를 추가 설치해 줄 것을 제안합니다.\" — 자전거와 관련된 내용만 정답 인정\n총점 = ①+②+③ (0~6). 조건별 점수(g/h/o)를 따로 기록한다."}};
const MAX = { 'A3': 3, 'C4-2': 3, 'D5': 6 };
const KEY = 'allim2-mismatch-review-v1';
const C = DATA.cases;
let S = {}; try { S = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { S = {}; }
const id = c => c.num + '#' + c.no;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
let idx = 0, view = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const JUDGE = [['ai', 'AI가 맞음'], ['claude', 'Claude가 맞음'], ['neither', '둘 다 아님'], ['hold', '보류(협의 필요)']];
const isDone = c => { const s = S[id(c)]; return s && (s.score !== undefined && s.score !== null || s.judge); };

function filter() {
  const fi = $('#fItem').value, fs = $('#fState').value;
  view = C.filter(c => (!fi || c.num === fi) && (!fs || (fs === 'todo' ? !isDone(c) : fs === 'done' ? isDone(c) : (S[id(c)] || {}).rub)));
  if (idx >= view.length) idx = Math.max(0, view.length - 1);
}
function prog() { const n = C.filter(isDone).length; $('#prog').style.width = (n / C.length * 100) + '%'; return n; }

function render() {
  filter();
  const done = prog();
  const v = $('#view');
  if (!view.length) { v.innerHTML = '<div class="card">조건에 맞는 답안이 없습니다.</div>'; return; }
  const c = view[idx], s = S[id(c)] || {}, mx = MAX[c.num];
  const parts = c.parts ? `<p>①그래프 ${c.parts[0]} · ②항목·비율 ${c.parts[1]} · ③의견 ${c.parts[2]}</p>` : '';
  let sb = '';
  for (let k = 0; k <= mx; k++) {
    const t = k === c.c && k === c.ai ? '<span class="tag ca">둘 다</span>' : k === c.c ? '<span class="tag c">Claude</span>' : k === c.ai ? '<span class="tag a">AI</span>' : '';
    sb += `<button type="button" data-s="${k}" class="${s.score === k ? 'on' : ''}">${t}${k}</button>`;
  }
  v.innerHTML = `
  <div class="top"><span class="chip">${c.num} · ${mx}점</span><span class="chip">#${c.no}</span><span class="chip v">${esc(c.verdict)}</span>
    <span class="pos">${idx + 1} / ${view.length} ${view.length !== C.length ? `(전체 ${C.length})` : ''} · 판단 ${done}/${C.length} ${isDone(c) ? '<span class="done-mark">✓</span>' : ''}</span></div>
  <div class="card"><h2>학생 답안</h2><div class="answer">${esc(c.answer)}</div></div>
  <div class="two">
    <div class="who c"><div class="t">Claude 채점(협의록 기준)</div><b class="s">${c.c}점</b><p>${esc(c.cwhy)}</p>${parts}${c.flag ? `<p class="t">검토 표시: ${esc(c.flag)}</p>` : ''}</div>
    <div class="who a"><div class="t">사이트 AI 채점</div><b class="s">${c.ai}점</b><p>${esc(c.air)}</p></div>
  </div>
  <div class="card note" style="margin-top:12px"><h2>왜 다른가(분석)</h2><div><b>${esc(c.type)}</b></div><div class="vd">${esc(c.verdict)}</div><div>${esc(c.note)}</div></div>
  <details class="rub"><summary>${c.num} 채점 기준(협의록) 보기</summary><pre>${esc(DATA.rubric[c.num])}</pre></details>
  <div class="card dec"><h2>내 판단 — 최종 점수</h2><div class="scores">${sb}</div>
    <h2>어느 쪽이 맞나</h2><div class="opts">${JUDGE.map(([k, t]) => `<button type="button" data-j="${k}" class="${s.judge === k ? 'on' : ''}">${t}</button>`).join('')}</div>
    <label class="ck"><input type="checkbox" id="rub" ${s.rub ? 'checked' : ''}> 채점 기준 수정·예시답안 추가 필요</label>
    <textarea id="memo" placeholder="메모: 기준을 어떻게 고칠지, 예시답안 문구 등">${esc(s.memo || '')}</textarea></div>
  <nav class="foot"><button type="button" id="prev" ${idx === 0 ? 'disabled' : ''}>← 이전</button><button type="button" class="next" id="next">${idx === view.length - 1 ? '마지막입니다' : '다음 →'}</button></nav>`;
  v.querySelectorAll('.scores button').forEach(b => b.onclick = () => setScore(+b.dataset.s));
  v.querySelectorAll('.opts button').forEach(b => b.onclick = () => setJudge(b.dataset.j));
  $('#rub').onchange = e => { upd({ rub: e.target.checked }); };
  $('#memo').oninput = e => { upd({ memo: e.target.value }, true); };
  $('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
  if ($('#list').classList.contains('show')) list();
}
function upd(o, quiet) { const k = id(view[idx]); S[k] = Object.assign({}, S[k], o, { at: new Date().toISOString() }); save(); if (!quiet) render(); else prog(); }
function setScore(k) {
  const c = view[idx]; const j = (S[id(c)] || {}).judge;
  const auto = k === c.ai && k !== c.c ? 'ai' : k === c.c && k !== c.ai ? 'claude' : (k !== c.ai && k !== c.c ? 'neither' : j);
  upd({ score: k, judge: j === 'hold' ? 'hold' : auto });
}
function setJudge(j) {
  const c = view[idx], s = S[id(c)] || {};
  const o = { judge: j };
  if (j === 'ai') o.score = c.ai; if (j === 'claude') o.score = c.c;
  if (j === 'neither' && (s.score === c.ai || s.score === c.c)) o.score = null;
  upd(o);
}
function go(d) { const n = idx + d; if (n < 0 || n >= view.length) return; idx = n; render(); window.scrollTo(0, 0); }
function list() {
  const L = $('#list');
  L.innerHTML = '<table><tr><th>#</th><th>문항</th><th>번호</th><th>Claude</th><th>AI</th><th>판단</th><th>최종</th><th>기준</th><th>유형</th></tr>' +
    view.map((c, i) => { const s = S[id(c)] || {}; return `<tr data-i="${i}" style="${i === idx ? 'background:#e8eef8' : ''}"><td>${i + 1}</td><td>${c.num}</td><td>${c.no}</td><td>${c.c}</td><td>${c.ai}</td><td>${(JUDGE.find(x => x[0] === s.judge) || ['', ''])[1]}</td><td>${s.score ?? ''}</td><td>${s.rub ? '✓' : ''}</td><td>${esc(c.type)}</td></tr>`; }).join('') + '</table>';
  L.querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = () => { idx = +tr.dataset.i; L.classList.remove('show'); render(); });
}
function csvCell(v) { v = String(v ?? ''); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCsv() {
  const head = ['문항', '학생 번호', 'Claude 점수', 'AI 점수', '최종 점수(내 판단)', '판단', '기준 수정 필요', '메모', '유형', '분석 판단', '학생 답안', 'Claude 근거', 'AI 근거', '판단 시각'];
  const rows = C.map(c => { const s = S[id(c)] || {}; return [c.num, c.no, c.c, c.ai, s.score ?? '', (JUDGE.find(x => x[0] === s.judge) || ['', ''])[1], s.rub ? 'O' : '', s.memo || '', c.type, c.verdict, c.answer, c.cwhy, c.air, s.at || '']; });
  const text = '﻿' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  const d = new Date(); a.download = `불일치판단_${d.getMonth() + 1}${String(d.getDate()).padStart(2, '0')}_${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}
function parseCsv(t) {
  const out = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) { const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { row.push(f); f = ''; } else if (ch === '\n') { row.push(f); out.push(row); row = []; f = ''; } else if (ch !== '\r') f += ch; }
  if (f || row.length) { row.push(f); out.push(row); } return out;
}
$('#fileIn').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  const rows = parseCsv((await file.text()).replace(/^﻿/, '')); const h = rows.shift();
  const ix = n => h.indexOf(n); let n = 0;
  rows.forEach(r => { if (!r[ix('문항')]) return; const k = r[ix('문항')] + '#' + r[ix('학생 번호')];
    const sc = r[ix('최종 점수(내 판단)')]; const jt = r[ix('판단')]; const j = (JUDGE.find(x => x[1] === jt) || [''])[0];
    if (sc === '' && !j && !r[ix('메모')] && !r[ix('기준 수정 필요')]) return;
    S[k] = { score: sc === '' ? null : +sc, judge: j || undefined, rub: r[ix('기준 수정 필요')] === 'O', memo: r[ix('메모')] || '', at: r[ix('판단 시각')] || '' }; n++; });
  save(); e.target.value = ''; render(); $('#view').insertAdjacentHTML('afterbegin', `<div class="card" style="background:#e6f4ec">CSV에서 판단 ${n}건을 불러왔습니다.</div>`);
};
$('#bCsv').onclick = exportCsv;
$('#bList').onclick = () => { const L = $('#list'); L.classList.toggle('show'); if (L.classList.contains('show')) list(); };
$('#fItem').onchange = $('#fState').onchange = () => { idx = 0; render(); };
document.addEventListener('keydown', e => {
  if (e.target.matches('textarea, input, select')) return;
  if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
  else if (/^[0-9]$/.test(e.key) && view.length && +e.key <= MAX[view[idx].num]) setScore(+e.key);
  else if (e.key === 'a' || e.key === 'A' || e.key === 'ㅁ') setJudge('ai');
  else if (e.key === 'c' || e.key === 'C' || e.key === 'ㅊ') setJudge('claude');
  else if (e.key === 'n' || e.key === 'N' || e.key === 'ㅜ') setJudge('neither');
});
render();
</script>
